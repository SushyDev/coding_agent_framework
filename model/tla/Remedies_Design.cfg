\* The design: a delegate whose background command outlives its report and may hang, and a
\* main that goes absent twice, a cap of two per kind; no bound passes and no restart
\* (slow/Remedies_Large.cfg has both); no resume waits at a limit (Remedies_Wait.cfg).
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    MayWait = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneReport
    StuckAfterReport
    EndedQuiet
    NoMessageIntoOwnTurn
    ReadBusy
    ResumeOncePerBound
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
    ActOnlyForBound
    WaitedEnd
PROPERTIES
    ReportTaken
    ReadsIdleAgain
    ActedOrAsked
    ClaimsEnd
    WaitSettled
CHECK_DEADLOCK FALSE

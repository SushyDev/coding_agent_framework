\* The design, one kind of agent: a delegate whose background command outlives its report and
\* may hang, a cap of two, across a restart of the healer and a bound that passes; no message to
\* it. Its parent's message is Remedies_Messages.cfg's; a main that goes absent and a resume
\* that waits are Remedies_Wait.cfg's; both kinds at once, slow/Remedies_Large.cfg's.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 1
    MaxBounds = 1
    MayWait = FALSE
    Messages = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneReport
    StuckAfterReport
    EndedQuiet
    NoMessageIntoOwnTurn
    ReadBusy
    ResumeOncePerBound
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
    ActOnlyForBound
    WaitedEnd
PROPERTIES
    ReportTaken
    ReadsIdleAgain
    ActedOrAsked
    ClaimsEnd
    WaitSettled
CHECK_DEADLOCK FALSE

\* The design: a delegate whose background command hangs and a main that goes absent twice,
\* a cap of two per kind; no bound passes and no restart (slow/Remedies_Large.cfg has both).
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    Break = "none"
INVARIANTS
    TypeOK
    PartialOnce
    ResumeOncePerBound
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
PROPERTIES
    ReportTaken
    ActedOrAsked
    ClaimsEnd
CHECK_DEADLOCK FALSE

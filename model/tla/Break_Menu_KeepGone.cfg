\* The row keeps a menu the pane no longer shows: LeavesWhenGone fails.
SPECIFICATION Spec
CONSTANTS
    Menus = {"m1", "m2"}
    Labels <- AB
    MaxDraws = 3
    MaxRestarts = 1
    Break = "KeepGone"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce
PROPERTIES
    LeavesWhenGone MenuShown
CHECK_DEADLOCK FALSE

\* An agent messages the operator, as if it were an addressee: the row is a message, not an ask.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxAsks = 0
    MaxRequests = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    StartsRefused = FALSE
    Forcing = FALSE
    Break = "MessageToOperator"
INVARIANTS
    OperatorRowsKept
CHECK_DEADLOCK FALSE

\* The first agent's crash spends the second's budget, which gives up with no crash of its own.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    Addressee = a1
    NIds = 1
    Cap = 1
    MaxGen = 2
    MaxStuck = 1
    Budget = 1
    MaxCrashes = 1
    MaxWhole = 1
    MaxLimits = 0
    Delegated = FALSE
    Break = "SharedBudget"
INVARIANTS
    OwnBudget
CHECK_DEADLOCK FALSE

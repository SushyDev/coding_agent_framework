\* The design with a run_delegate call that waits on the report: a client that may give up
\* first, a restart, and a parent stop. Every invariant and liveness property.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 2
    MaxParentStops = 1
    Awaited = {d1}
    ClientLeaves = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    AnsweredNotSent
    AnsweredWasWritten
    TwiceOnlyIfUnsure
PROPERTIES
    AnsweredStays
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

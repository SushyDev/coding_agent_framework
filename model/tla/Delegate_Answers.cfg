\* The design with a run_delegate call that waits on the report: a client that may give up
\* first, a restart, and a parent stop, with no kill. Every invariant and liveness property.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 0
    MaxParentStops = 1
    Awaited = {d1}
    ClientLeaves = TRUE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 0
    Queued = {}
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    WorkEndedIsFree
    OneMessagePerProcess
    ReportAnswersTheBrief
PROPERTIES
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

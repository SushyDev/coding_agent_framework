\* A second start of a branch that goes on while its session is live: Sessions refuses the name,
\* and the row is refused while its process runs on. RefusedHoldsNothing must fail.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 0
    MaxKills = 0
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 1
    Break = "StartOverLive"
INVARIANTS
    RefusedHoldsNothing
CHECK_DEADLOCK FALSE

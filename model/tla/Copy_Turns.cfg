\* The design: a job (with no fetch) and a service on one copy take turns at the sync, with a drop and a restart; every invariant, and RunAnswered (slow/Copy_Large checks the other properties with two runs).
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1}
    Svcs = {s1}
    Paths = {f1}
    Fetched = {}
    Codes = {"1"}
    MaxDrops = 1
    MaxRestarts = 1
    MaxEdits = 0
    MaxLost = 0
    MaxSvcRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    StartsOnSyncedCopy
    NoUntrackedProcess
    AnswerIsReal
    FetchOnlyNamed
    FetchOnlyAfterEnd
    OneProcess
    EndedIsEnded
PROPERTIES
    RunAnswered
CHECK_DEADLOCK FALSE

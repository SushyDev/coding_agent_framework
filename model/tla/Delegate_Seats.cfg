\* A finished delegate frees its seat (F-301): one delegate in Seats, two rows stored to it
\* once finished, one restart. Its lease is free from its finish until the next turn's grant,
\* no row's turn runs without one, and a refused ask leaves it free.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 0
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 0
    Queued = {}
    Seats = {d1}
    MaxMsgs = 2
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    CapHeld
    RefusedHoldsNothing
    WorkEndedIsFree
    NoTurnWithoutGrant
PROPERTIES
    FreeIsReleased
    FreesOnceIdle
    RowGoes
    ReportArrives
CHECK_DEADLOCK FALSE

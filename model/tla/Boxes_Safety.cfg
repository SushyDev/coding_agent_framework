\* The design: two agents on one seat, a row to the first, a dialog, a stuck turn, a crash of
\* each agent process and a whole restart.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    Addressee = a1
    NIds = 1
    Cap = 1
    MaxGen = 2
    MaxStuck = 1
    Budget = 1
    MaxCrashes = 1
    MaxWhole = 1
    MaxLimits = 0
    Break = "none"
INVARIANTS
    TypeOK
    NotCutByStop
    OnlyToItsProcess
    LeaseWhileLive
    SeatsHold
    OneAnswer
    KeptAcrossRestart
    OneActPerState
    NeverWorking
    OneClaimPerState
    NoActOnCutOffClaim
    OneProcess
    AtMostOnce
    OwnBudget
CHECK_DEADLOCK FALSE

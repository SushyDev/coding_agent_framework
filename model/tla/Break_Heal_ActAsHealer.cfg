\* A person's "act" claimed as the healer's: counted in its cap, past it.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer", "person"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "ActAsHealer"
INVARIANTS
    CapToPrompt
CHECK_DEADLOCK FALSE

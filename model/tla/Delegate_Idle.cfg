\* A delegate idle with no report (F-150): a turn that ends with no report, one kill (so the
\* resumed process may stall again, a second idle state, or the branch is started again) and
\* one restart. Told once per idle state, and always told while the state lasts.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 1
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {d1}
    MaxAgain = 1
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    ReportAnswersTheBrief
    IdleToldOnce
PROPERTIES
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
    IdleNoticed
CHECK_DEADLOCK FALSE

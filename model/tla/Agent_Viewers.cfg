\* The design's liveness, with every invariant: lost viewers are seen and reopened.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 1
    MaxWrites = 0
    MaxRecoveryRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
    OneReopenPerLoss
PROPERTIES
    AgentOutlivesServer
    LostViewerReopened
    UnviewedAgentSeen
CHECK_DEADLOCK FALSE

\* F-240: a row too wide to type waits for a waiter with no bound. The session is idle and no
\* turn of it ends, so no waiter comes: the row, and row 2 behind it, wait for ever.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 0
    Long = {1}
    Wide = {1}
    Launched = {}
    Break = "WaitForever"
PROPERTIES
    Arrives
CHECK_DEADLOCK FALSE

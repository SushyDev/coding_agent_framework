\* F-256: row 1 is a prompt's notice to an interactive session, row 2 an ordinary message behind
\* it, from one sender. The prompt may close while row 1 is due or marked, whatever the transport
\* (a waiter, the typed write or a launch's start), across a restart and a person's prompt.
\* Every property: a notice whose prompt closed is never handed on and is withdrawn; row 2
\* arrives either way; an open prompt's notice is delivered.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    Notices = {1}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ClosedNotHandedOn
    WithdrawnWhy
PROPERTIES
    SendingSettles
    Arrives
    UnknownStays
CHECK_DEADLOCK FALSE

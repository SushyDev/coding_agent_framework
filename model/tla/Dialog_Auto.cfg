\* The app's callback answers the trust dialog; the imports dialog waits on a person.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 1
    Auto = {"trust"}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce NotEndedOnDialog LeaseWhileLive
PROPERTIES
    DialogShown GoesOn
CHECK_DEADLOCK FALSE

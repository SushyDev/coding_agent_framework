\* A move reads the app's flag on its target at its pick only: the app flags the target during
\* the drain, and the move's resume still runs there.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Headless = FALSE
    Flags = TRUE
    Unsure = FALSE
    Break = "PickOnly"
PROPERTIES
    NoResumeOnRefused
CHECK_DEADLOCK FALSE

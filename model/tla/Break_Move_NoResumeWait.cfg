\* A move's resume with no deadline of its own: the check answers unknown for the target and
\* never answers again, and the resume waits for ever.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Headless = FALSE
    Flags = FALSE
    Unsure = TRUE
    Break = "NoResumeWait"
PROPERTIES
    ResumeEnds
CHECK_DEADLOCK FALSE

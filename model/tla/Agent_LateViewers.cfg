\* A start's viewer opening late, between the sampler's reads, and three losses of one agent: liveness.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 2
    MaxWrites = 0
    MaxRecoveryRestarts = 0
    MaxLateViewers = 1
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
    OneReopenPerLoss
    NoActOnOneWrongReading
PROPERTIES
    AgentOutlivesServer
    LostViewerReopened
    UnviewedAgentSeen
CHECK_DEADLOCK FALSE

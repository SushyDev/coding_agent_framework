    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Headless = FALSE
    Flags = FALSE
    Unsure = TRUE

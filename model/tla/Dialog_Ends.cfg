\* An end asked while the start waits on the trust dialog (F-231): its exit option pressed, or
\* SIGTERM, then the row ended; a person answers, presses at the viewer, and a restart cuts the
\* first end, which a person asks again.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustOnly
    MaxRestarts = 1
    Ends = TRUE
    Auto = {}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart NoTurnAfterEnd
PROPERTIES
    DialogShown GoesOn EndEnds
CHECK_DEADLOCK FALSE

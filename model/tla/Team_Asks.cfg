\* The design: each agent may ask a person, over a restart; the operator answers once, to the asker, and the answer is delivered, or settled ended when the asker ended first.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 0
    MaxAsks = 1
    MaxFaults = 0
    MaxRestarts = 1
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
    OperatorRowsKept
    AnswerOnce
    AnswerToAsker
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
CHECK_DEADLOCK FALSE

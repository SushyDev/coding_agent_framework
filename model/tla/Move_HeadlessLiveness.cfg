\* The liveness of a headless session's move: a drained session moves, its own word or a row
\* due its first line, and every row to it arrives, the Mover's word among them.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 1
    Resumes = FALSE
    Limited = FALSE
    Headless = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    OnceAcrossMove
    NotCutByEnd
    OnlyIntoEndedTurn
PROPERTIES
    HeadlessResumeHasLine
    DrainedParentMoves
    RowsArrive
CHECK_DEADLOCK FALSE

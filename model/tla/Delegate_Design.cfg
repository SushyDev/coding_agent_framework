\* The design with two delegates and the cap: every invariant. The liveness is checked with one
\* delegate (Delegate_Restarts, Delegate_Answers, Delegate_Cap).
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1, d2}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 2
    MaxParentStops = 1
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    ReportAnswersTheBrief
CHECK_DEADLOCK FALSE

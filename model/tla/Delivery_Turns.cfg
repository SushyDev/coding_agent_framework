\* An interactive session, for the liveness: two rows from one sender, a prompt, a stop
\* and a restart.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 1
    Long = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    NoLongTyped
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
CHECK_DEADLOCK FALSE

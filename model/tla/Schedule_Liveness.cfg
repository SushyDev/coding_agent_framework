\* The design's liveness: a landing and a heavy run on one account, one restart.
SPECIFICATION Spec
CONSTANTS
    Shape = "Liveness"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    QueuedIsAnswered
    EndedIsReleased
CHECK_DEADLOCK FALSE

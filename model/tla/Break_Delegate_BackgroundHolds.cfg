\* An interactive delegate's report waits until its session file no longer reads `shell`: a
\* background command its turn started that never ends holds the report for ever (F-269).
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 0
    MaxKills = 0
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {d1}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 0
    Queued = {}
    Break = "BackgroundHolds"
PROPERTIES
    ReportArrives
CHECK_DEADLOCK FALSE

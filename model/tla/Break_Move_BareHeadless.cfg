\* A headless session moved with no row due is resumed with no first line: Claude Code headless
\* writes its init only after one, so the resume is never confirmed.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Headless = TRUE
    Break = "BareHeadless"
PROPERTIES
    HeadlessResumeHasLine
CHECK_DEADLOCK FALSE

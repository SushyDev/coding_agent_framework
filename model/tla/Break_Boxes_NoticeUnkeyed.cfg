\* The parent's notice of a prompt is stored under a key of its own, so a read after the whole restart tells the parent again (F-179).
SPECIFICATION Spec
CONSTANTS
    Agents = {a1}
    Addressee = a1
    NIds = 1
    Cap = 1
    MaxGen = 2
    MaxStuck = 1
    Budget = 1
    MaxCrashes = 1
    MaxWhole = 1
    MaxLimits = 0
    Delegated = TRUE
    Break = "NoticeUnkeyed"
INVARIANTS
    ParentToldOnce
CHECK_DEADLOCK FALSE

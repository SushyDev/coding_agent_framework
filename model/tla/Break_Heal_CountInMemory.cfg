\* The cap counts in memory: a restart starts it again, and the second passes the cap.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "CountInMemory"
INVARIANTS
    CapToPrompt
CHECK_DEADLOCK FALSE

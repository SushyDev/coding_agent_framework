\* A resume runs on the account with the most allowance left, whose transcript lacks the
\* conversation: Claude Code would find no such session there.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 0
    Resumes = TRUE
    Limited = FALSE
    Break = "ResumeOnPicked"
PROPERTIES
    TranscriptKept
CHECK_DEADLOCK FALSE

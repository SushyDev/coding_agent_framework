\* The native wrapper's end is read from its own post, which a kill never sends: a wrapper
\* killed while it runs keeps its lease past the command's end.
SPECIFICATION Spec
CONSTANTS
    Shape = "Native"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "EndByPost"
PROPERTIES
    GoneIsReleased
CHECK_DEADLOCK FALSE

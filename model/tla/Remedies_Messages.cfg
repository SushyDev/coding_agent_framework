\* A parent's message to a delegate whose background command outlives its report (F-204): handed
\* on only on the fold's idle read, never into the turn a command's end begins, and a release
\* that starts no turn read idle again once its bound passes; the remedy of its stuck command
\* beside it, across a restart of the healer and a bound that passes. No main.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 1
    MaxBounds = 1
    MayWait = FALSE
    Messages = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneReport
    StuckAfterReport
    EndedQuiet
    NoMessageIntoOwnTurn
    ReadBusy
    ResumeOncePerBound
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
    ActOnlyForBound
    WaitedEnd
PROPERTIES
    ReportTaken
    ReadsIdleAgain
    ActedOrAsked
    ClaimsEnd
    WaitSettled
CHECK_DEADLOCK FALSE

\* The parent's notice is stored under a key of its own, not the prompt's: a restart stores it again, and the parent is told twice (F-179).
SPECIFICATION Spec
CONSTANTS
    Ps = {"ask"}
    HeldPs <- AloneHeld
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {"limit"}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 1
    MaxRestarts = 1
    MaxTools = 0
    Break = "NoticeUnkeyed"
INVARIANTS
    ParentToldOnce
CHECK_DEADLOCK FALSE

\* Two writes, each a load, a paste and an Enter, across a restart: each pane gets its own write's text.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 0
    MaxWrites = 2
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    PastesItsOwnText
    OneProcessPerSocket
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

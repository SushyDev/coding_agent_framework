\* A resume of the session once its process ended by itself while the app flags an account and
\* lifts the flag at any time (F-209): on its own account while that is not refused, else after
\* a copy to the picked one, else refused; a copy refused or cut by a restart; a move before it
\* and a person's prompt.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = TRUE
    Limited = FALSE
    Headless = FALSE
    Flags = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    NothingLost
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
    CopySettles
    NoResumeOnRefused
CHECK_DEADLOCK FALSE

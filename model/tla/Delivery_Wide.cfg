\* F-240: an interactive session held across a restart, one sender, row 1 too wide to type (its
\* pointer line wider than the box) and row 2 behind it. A restart cuts the waiter; a prompt may
\* or may not come, and the wake line may or may not start a turn. Row 3 is room for the notice.
\* Every property: row 1 goes by a waiter or is undelivered at the bound; row 2 arrives either way.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 0
    Long = {1}
    Wide = {1}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
    UnknownWhy
    UndeliveredTold
    WakeOnce
PROPERTIES
    SendingSettles
    Arrives
    UnknownStays
CHECK_DEADLOCK FALSE

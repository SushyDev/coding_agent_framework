\* A headless session started with its brief (F-152), then a second message, marked only once
\* the process wrote its init after it read the brief; a restart, and a reply. Every
\* property but AnswerComes, which Delivery_HeadlessStart checks (with it and four rows, over a
\* minute).
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3}
    Addrs = {d}
    Headless = {d}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Launched = {d}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
CHECK_DEADLOCK FALSE

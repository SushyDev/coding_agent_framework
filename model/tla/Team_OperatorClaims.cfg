\* The design: the operator and a main session fix one delegate, and the operator the main sessions, over a fault and a restart.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 0
    MaxFaults = 1
    MaxRestarts = 1
    SelfTurns = FALSE
    Operators = {o}
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    NoActOnCutOffClaim
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
    ReplyOrNoticeComes
CHECK_DEADLOCK FALSE

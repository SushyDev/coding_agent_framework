\* The operator may force the end of an interactive session (F-170), beside Delivery_Interactive's
\* stop, prompt, crash and restart: a row still sending to it settles unknown.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1, s2}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 1
    Long = {2}
    Wide = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    UnknownStays
CHECK_DEADLOCK FALSE

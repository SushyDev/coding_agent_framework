\* The design: two symptoms of one kind come and go, a cap of one per bound, a bound that
\* passes, and a restart of the healer.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "none"
INVARIANTS
    TypeOK
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
PROPERTIES
    ActedOrAsked
    ClaimsEnd
CHECK_DEADLOCK FALSE

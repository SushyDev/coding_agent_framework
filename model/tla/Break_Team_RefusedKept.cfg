\* A delegate whose start was refused is never ended, as in the first end-to-end run (F-153):
\* its main session's end is refused for it forever.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}}
    Mains = {p}
    Services = {}
    MaxMsgs = 0
    MaxAsks = 0
    MaxRequests = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    StartsRefused = TRUE
    Forcing = FALSE
    Break = "RefusedKept"
PROPERTIES
    RefusedEnds
CHECK_DEADLOCK FALSE

\* A start whose lease is queued answers at once (F-170): one delegate, queued, two restarts
\* and one kill. Its outcome is told to the parent once, across restarts.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 2
    MaxKills = 1
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 0
    Queued = {d1}
    Seats = {}
    MaxMsgs = 0
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    WorkEndedIsFree
    OneMessagePerProcess
    ReportAnswersTheBrief
    StartToldOnce
PROPERTIES
    StartNoticed
    CallSettles
    ReportArrives
CHECK_DEADLOCK FALSE

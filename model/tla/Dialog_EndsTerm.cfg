\* An end asked at either dialog (F-231), no restart: the trust dialog's exit press, and the
\* imports dialog's SIGTERM, which has no exit option.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 0
    Ends = TRUE
    Trusted = FALSE
    Auto = {}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart NoTurnAfterEnd
PROPERTIES
    DialogShown GoesOn EndEnds
CHECK_DEADLOCK FALSE

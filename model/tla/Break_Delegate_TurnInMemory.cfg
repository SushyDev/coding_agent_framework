\* An own turn's notice mark kept in memory, not as Mailbox's key: after a restart the turn is
\* read again and the parent is told a second time. TurnToldOnce must fail.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 0
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 1
    Queued = {}
    Seats = {}
    MaxMsgs = 0
    Break = "TurnInMemory"
INVARIANTS
    TurnToldOnce
CHECK_DEADLOCK FALSE

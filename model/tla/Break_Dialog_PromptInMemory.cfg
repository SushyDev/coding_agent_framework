\* An open prompt is kept in memory: a whole restart loses it while its dialog still shows.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 1
    Ends = FALSE
    Trusted = FALSE
    Auto = {}
    Break = "PromptInMemory"
INVARIANTS
    KeptAcrossRestart
CHECK_DEADLOCK FALSE

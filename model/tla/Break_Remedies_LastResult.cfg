\* Without the guard: the report is read from the latest result, so the turn a background command's end began is taken as a second report.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    MayWait = FALSE
    Messages = FALSE
    Break = "LastResult"
INVARIANTS
    OneReport
CHECK_DEADLOCK FALSE

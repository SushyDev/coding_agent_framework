\* A person's main session under severe pressure: a main session and a builder from two modules
\* share one seat, one restart. A main session is always admitted; the builder is not.
SPECIFICATION Spec
CONSTANTS
    Shape = "Mains"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
CHECK_DEADLOCK FALSE

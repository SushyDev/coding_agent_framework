\* The design's safety: a landing and two heavy runs from two modules, one of each resource,
\* one restart.
SPECIFICATION Spec
CONSTANTS
    Shape = "Safety"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
CHECK_DEADLOCK FALSE

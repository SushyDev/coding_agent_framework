\* A launch row's line is read in the window its mark took of the agent's session before the
\* start, which a new start does not write (F-282): the line never shows there, and the row stays
\* sending while its process lives, so SendingSettles fails.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = FALSE
    MaxRestarts = 0
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {m}
    Break = "OldWindow"
PROPERTIES
    SendingSettles
CHECK_DEADLOCK FALSE

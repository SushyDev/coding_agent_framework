\* A restart after the write: the message is queued again and typed twice.
SPECIFICATION Spec
CONSTANTS
    Agents = {p, d1}
    Parent = p
    Foreign = {}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 0
    MaxRestarts = 1
    Break = "RedeliverAfterRestart"
INVARIANTS
    DeliveredAtMostOnce
CHECK_DEADLOCK FALSE

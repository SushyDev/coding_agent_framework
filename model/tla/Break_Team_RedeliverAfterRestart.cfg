\* A restart after the write: the message is queued again and typed twice.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q, e1}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 0
    MaxRestarts = 1
    Break = "RedeliverAfterRestart"
INVARIANTS
    DeliveredAtMostOnce
CHECK_DEADLOCK FALSE

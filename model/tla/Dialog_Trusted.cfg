\* A start in a folder the operator's rule names (F-286): the framework presses its trust
\* dialog, and the imports dialog waits on a person; a restart may cut the rule's press. With an
\* end asked too, slow/Dialog_TrustedEnds.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 1
    Ends = FALSE
    Trusted = TRUE
    Auto = {}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart
PROPERTIES
    DialogShown GoesOn RulePasses
CHECK_DEADLOCK FALSE

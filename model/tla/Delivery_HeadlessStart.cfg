\* A headless session started with its first row (F-152): its brief, marked by stream before its
\* start and written right after the hold, its init only after it read that line, a crash and its
\* resume with the word to go on or the brief again, a restart, and the replies. Every property.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3}
    Addrs = {d}
    Headless = {d}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    Notices = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {d}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
    AnswerComes
CHECK_DEADLOCK FALSE

\* A person answers each menu from the inbox, by a label or esc, or at the viewer, or never.
SPECIFICATION Spec
CONSTANTS
    Menus = {"m1", "m2"}
    Labels <- AB
    MaxDraws = 3
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce
PROPERTIES
    LeavesWhenGone MenuShown
CHECK_DEADLOCK FALSE

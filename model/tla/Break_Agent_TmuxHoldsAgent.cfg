\* An agent run inside its pane ends with the tmux server.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 1
    MaxServerDeaths = 1
    MaxViewerDeaths = 0
    MaxWrites = 0
    MaxRecoveryRestarts = 0
    Break = "TmuxHoldsAgent"
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

\* A resume runs on its row's account while the app flags that account (or its windows have no
\* room): the account is not the one it claims to be, and the conversation goes on there.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 0
    Resumes = TRUE
    Limited = FALSE
    Headless = FALSE
    Flags = TRUE
    Break = "ResumeInPlace"
PROPERTIES
    NoResumeOnRefused
CHECK_DEADLOCK FALSE

\* A report is marked and answered once the row says stopping; the SIGTERM cuts its turn.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Break = "MarkWhileEnding"
INVARIANTS
    NotCutByEnd
CHECK_DEADLOCK FALSE

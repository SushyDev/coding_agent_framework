\* A reply's once-check held in memory: a restart forgets it, and the message gets a second reply.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 0
    MaxRestarts = 1
    SelfTurns = FALSE
    Break = "ReplyInMemory"
INVARIANTS
    ReplyOnce
CHECK_DEADLOCK FALSE

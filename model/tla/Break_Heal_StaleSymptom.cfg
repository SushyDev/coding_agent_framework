\* The healer claims on a fact it recorded before: the symptom has gone, and it acts anyway.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "StaleSymptom"
INVARIANTS
    OnlyOnSymptom
CHECK_DEADLOCK FALSE

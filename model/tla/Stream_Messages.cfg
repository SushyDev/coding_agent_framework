\* The design: two messages in turn, one permission request, two restarts.
SPECIFICATION Spec
CONSTANTS
    MaxMsgs = 2
    MaxReqs = 1
    MaxRestarts = 2
    MaxResumes = 0
    Break = "none"
INVARIANTS
    TypeOK
    NoDoubleRead
    NoSkippedEvent
    NoPartialRead
    NeverMalformed
    WrittenOnce
    TakenOnce
    IntoEndedTurn
    OneWaiting
    DeliveredWasTaken
    UndeliveredWasNotTaken
    OnlyNamedRequest
    AnswerOnce
    AnsweredWasTaken
    EndNeverCuts
    EndAfterReport
    EndLosesNoMessage
    NoJoinedEvent
PROPERTIES
    ReplayedOrFound
    AnswerSettles
CHECK_DEADLOCK FALSE

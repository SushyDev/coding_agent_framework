    Headless = {}
    Senders = {s1, s2}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 1
    Long = {}
    Wide = {}
    Launched = {}
    Break = "MarkWhileStopping"
INVARIANTS
    NotCutByStop
CHECK_DEADLOCK FALSE

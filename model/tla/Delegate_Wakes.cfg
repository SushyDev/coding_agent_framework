\* A delegate's own turn after its report (F-155): one headless delegate, woken once by its own
\* background command, one kill and one restart. Each own turn is told once, never as the
\* report, and always told.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 1
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {}
    MaxAgain = 0
    MaxWakes = 1
    Queued = {}
    Seats = {}
    MaxMsgs = 0
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    WorkEndedIsFree
    OneMessagePerProcess
    ReportAnswersTheBrief
    TurnToldOnce
    TurnNotReport
PROPERTIES
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
    TurnNoticed
CHECK_DEADLOCK FALSE

\* A main's resume that may wait at a usage limit (F-203), its claim settled from its row's end,
\* across a restart of the healer and a bound that passes; no delegate.
SPECIFICATION Spec
CONSTANTS
    Delegates = {}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 1
    MaxBounds = 1
    MayWait = TRUE
    Messages = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneReport
    StuckAfterReport
    EndedQuiet
    ResumeOncePerBound
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
    ActOnlyForBound
    WaitedEnd
    LeftNotAsked
PROPERTIES
    ReportTaken
    ActedOrAsked
    ClaimsEnd
    WaitSettled
CHECK_DEADLOCK FALSE

\* A limited session's failed move goes back as any move does: resumed on its own account, at
\* its limit.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = TRUE
    Headless = FALSE
    Flags = FALSE
    Unsure = FALSE
    Break = "BackIntoLimit"
PROPERTIES
    NoResumeIntoLimit
CHECK_DEADLOCK FALSE

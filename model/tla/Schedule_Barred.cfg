\* F-276: two heavy runs of one module on one slot, under any pressure, each caller free to go
\* while it waits, no restart. A barred request keeps its place; a caller gone is never granted.
SPECIFICATION Spec
CONSTANTS
    Shape = "Barred"
    QueueBound = 2
    MaxWait = 2
    MaxCrashes = 0
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
    NoGrantToGone
    KeepsPlace
    QueuedIsAnswered
    EndedIsReleased
CHECK_DEADLOCK FALSE

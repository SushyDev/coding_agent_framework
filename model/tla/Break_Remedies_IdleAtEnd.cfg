\* Without the guard: the fold reads the turn ended at a background command's end, before the init of the turn the end begins, so Mailbox hands a parent's message into that turn.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    MayWait = FALSE
    Break = "IdleAtEnd"
INVARIANTS
    NoMessageIntoOwnTurn
CHECK_DEADLOCK FALSE

\* A headless session, for the liveness: its brief, two ends of its process (a
\* resume, then a notice), and a restart. Every property.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3}
    Addrs = {d}
    Headless = {d}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 2
    MaxPrompts = 0
    MaxStops = 0
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
    AnswerComes
CHECK_DEADLOCK FALSE

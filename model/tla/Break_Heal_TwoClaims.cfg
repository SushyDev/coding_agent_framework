\* A second claim on a claimed state: two remedies act on one state.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 2
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "TwoClaims"
INVARIANTS
    OncePerState
CHECK_DEADLOCK FALSE

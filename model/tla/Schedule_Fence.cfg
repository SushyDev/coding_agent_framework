\* The fence: two heavy runs from two modules on one slot, each start sent to a host where it
\* may land late, one restart.
SPECIFICATION Spec
CONSTANTS
    Shape = "Fence"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
    NoRunUnleased
    HostCapacity
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
    QueuedIsAnswered
    EndedIsReleased
CHECK_DEADLOCK FALSE

\* Without the guard: a resume that waits at a usage limit is settled verified at once, so a
\* wait a person left, or whose pick was refused, never reaches the fault ledger.
SPECIFICATION Spec
CONSTANTS
    Delegates = {}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    MayWait = TRUE
    Break = "SettleAtWait"
INVARIANTS
    WaitedEnd
CHECK_DEADLOCK FALSE

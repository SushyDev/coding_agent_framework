\* A resume of the session once its process ended by itself (F-177): on the account its row
\* names while that account has room, else after a copy to the picked one; a copy refused or cut
\* by a restart; a move before it, a person's prompt and a delegate's report.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = TRUE
    Limited = FALSE
    Headless = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    NothingLost
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
    CopySettles
CHECK_DEADLOCK FALSE

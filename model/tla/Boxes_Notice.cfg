\* The parent's notice (F-179): one delegate whose parent is an agent, a dialog's prompt, a crash
\* of its agent process and a whole restart; the parent is told of the prompt once, and always.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1}
    Addressee = a1
    NIds = 1
    Cap = 1
    MaxGen = 2
    MaxStuck = 0
    Budget = 1
    MaxCrashes = 1
    MaxWhole = 1
    MaxLimits = 0
    Delegated = TRUE
    Break = "none"
INVARIANTS
    ParentToldOnce
    KeptAcrossRestart
    OneAnswer
PROPERTIES
    ParentTold
    DialogPasses
CHECK_DEADLOCK FALSE

\* A check and a send in two tmux commands: a restart between them sends to another agent's pane.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 0
    MaxWrites = 1
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "CheckThenSend"
INVARIANTS
    TypeOK
    OldPaneIdNeverReachesAnother
CHECK_DEADLOCK FALSE

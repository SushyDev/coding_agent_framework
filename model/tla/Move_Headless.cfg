\* A headless session's move (F-193): a resume with a row due carries it as its first line, and
\* one with none due carries the Mover's own word, stored first. A report and a message, a crash
\* of the old process and a restart; the safety properties and the drained session's move.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 1
    MaxDelegates = 1
    MaxMsgs = 1
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = FALSE
    Limited = FALSE
    Headless = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
    HeadlessResumeHasLine
CHECK_DEADLOCK FALSE

\* The design: two actors claim two targets whose states move on, over restarts; a claim let
\* go with no act frees its state.
SPECIFICATION Spec
CONSTANTS
    Targets = {t1, t2}
    Actors = {x1, x2}
    MaxState = 1
    Break = "none"
INVARIANTS
    TypeOK
    OneClaimPerState
    OneActPerState
    NoActOnCutOffClaim
PROPERTIES
    EachClaimEnds
CHECK_DEADLOCK FALSE

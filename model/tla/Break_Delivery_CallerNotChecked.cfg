\* A call's write to a client whose process ended is marked delivered.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 1
    Awaited = {1}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 0
    Break = "CallerNotChecked"
INVARIANTS
    DeliveredWasTaken
CHECK_DEADLOCK FALSE

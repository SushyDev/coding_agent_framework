\* A headless start waits for its init before its first row, as before F-152: the process writes
\* its init only after it read a line, so its row is never running and nothing goes in.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {d}
    Headless = {d}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    Notices = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 0
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {d}
    Break = "BriefAfterInit"
PROPERTIES
    Arrives
CHECK_DEADLOCK FALSE

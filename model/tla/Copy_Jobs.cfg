\* The design: one job that fetches one of two paths, two drops, a restart, an edit, a lost wrapper.
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1}
    Svcs = {}
    Paths = {f1, f2}
    Fetched = {f1}
    Codes = {"0", "1"}
    MaxDrops = 2
    MaxRestarts = 1
    MaxEdits = 1
    MaxLost = 1
    MaxSvcRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    StartsOnSyncedCopy
    OneSyncWrites
    NoUntrackedProcess
    AnswerIsReal
    FetchOnlyNamed
    FetchOnlyAfterEnd
    NoEditLost
    JobGoneAtEnd
    OneProcess
PROPERTIES
    RunAnswered
    JobEndsAtTimeout
    JobSettles
CHECK_DEADLOCK FALSE

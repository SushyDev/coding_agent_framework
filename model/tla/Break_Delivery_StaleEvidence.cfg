\* StaleEvidence (F-289): a pass's read is applied to a row written since it was read. A forced
\* end settles a row unknown between the read and the apply, and the apply makes it due again.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1, s2}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 1
    Long = {2}
    Wide = {}
    Launched = {}
    Break = "StaleEvidence"
PROPERTIES
    UnknownStays
CHECK_DEADLOCK FALSE

\* F-277: the app answers the session's waiter itself at any turn's end, and the turn goes on
\* (Continued). A typed row (row 1 long, so typed as a pointer) settles by its line, and the
\* rows behind it arrive. Every property.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = TRUE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 0
    Long = {1}
    Wide = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
CHECK_DEADLOCK FALSE

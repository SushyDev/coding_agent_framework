\* The liveness of a limited session's move: it runs on the other account or is a person's, and
\* every row to it, the word among them, arrives.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 1
    Resumes = FALSE
    Limited = TRUE
    Headless = FALSE
    Flags = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    OnceAcrossMove
    NotCutByEnd
    OnlyIntoEndedTurn
PROPERTIES
    NoRowIntoLimit
    NoResumeIntoLimit
    LimitResumeCarriesRow
    LimitMoveSettles
CHECK_DEADLOCK FALSE

\* A limited session's move (F-191): its turn ends at the limit, the word is stored first, and
\* the move runs from the live process (drained, stopped) or from one gone at its limit (no
\* drain, no stop); a copy or resume refused leaves it gone. A report in flight and a restart.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 1
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = FALSE
    Limited = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
    NoRowIntoLimit
    NoResumeIntoLimit
    LimitResumeCarriesRow
CHECK_DEADLOCK FALSE

\* A move's resume whose check, and whose launch (F-212), may answer unknown at any time, and
\* never answer again, while the app flags an account and lifts the flag (F-211): past the
\* resume's deadline an unknown is taken as a refusal, so the resume ends: on the target, back
\* on its own account, or left down.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = FALSE
    Limited = FALSE
    Headless = FALSE
    Flags = TRUE
    Unsure = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    NothingLost
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
    NoResumeOnRefused
    ResumeEnds
CHECK_DEADLOCK FALSE

\* A wrapper runs without taking the fence, and an owner settles a start that has not landed yet
\* as never run: the start lands after its lease was released, beside the next run on the slot.
SPECIFICATION Spec
CONSTANTS
    Shape = "Fence"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "NoFence"
INVARIANTS
    NoRunUnleased
CHECK_DEADLOCK FALSE

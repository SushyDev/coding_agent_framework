\* The design: the operator forces the end of a main session (F-170), with a message to each; a
\* row still sending to it settles unknown.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxAsks = 0
    MaxRequests = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    StartsRefused = FALSE
    Forcing = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    FixClaimsChecked
    ClaimedStateNeedsFix
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    MainEndedByOperator
    MainEndedIdle
    ForcedByOperator
    NoDelegateWithoutParent
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
    OperatorRowsKept
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
    ReplyOrNoticeComes
CHECK_DEADLOCK FALSE

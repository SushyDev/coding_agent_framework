\* A limited session's move while the app flags an account and lifts the flag at any time
\* (F-210): a target flagged at the resume leaves it gone (Back), never resumed there nor into
\* its limit. Move_Limit's bounds.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 1
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = FALSE
    Limited = TRUE
    Headless = FALSE
    Flags = TRUE
    Unsure = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    NoResumeOnRefused
    TranscriptKept
    NoStartWhileDraining
    NoRowIntoLimit
    NoResumeIntoLimit
    LimitResumeCarriesRow
CHECK_DEADLOCK FALSE

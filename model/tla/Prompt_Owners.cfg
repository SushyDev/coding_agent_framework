\* Prompts whose owner is not a hold: a limit, its default the wait, its move's outcome known or not; and a restarts prompt past the asker's budget; the whole restart and the asker's own.
SPECIFICATION Spec
CONSTANTS
    Ps = {"limit", "restarts"}
    HeldPs = {}
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {"limit"}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 1
    MaxRestarts = 2
    MaxTools = 0
    Break = "none"
INVARIANTS
    TypeOK OneAnswer OnlyRightful NotAfterDeadline DefaultOnlyDeclared KeptAcrossRestart
    OneClaimPerState NoActOnCutOffClaim ParentToldOnce
PROPERTIES
    PromptsEnd ParentTold Escalated ClaimsEnd
CHECK_DEADLOCK FALSE

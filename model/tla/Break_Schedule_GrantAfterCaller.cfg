\* A grant does not look at whether the caller is gone: a request queued behind the slot is
\* granted after its caller's deadline passed or its process died.
SPECIFICATION Spec
CONSTANTS
    Shape = "Barred"
    QueueBound = 2
    MaxWait = 2
    MaxCrashes = 0
    Break = "GrantAfterCaller"
PROPERTIES
    NoGrantToGone
CHECK_DEADLOCK FALSE

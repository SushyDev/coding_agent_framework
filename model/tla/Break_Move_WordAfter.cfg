\* The limit's move begins before the word to go on is stored: its resume may carry no row, so
\* the limited turn never goes on, and a headless process gets no first line.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = TRUE
    Headless = FALSE
    Flags = FALSE
    Unsure = FALSE
    Break = "WordAfter"
PROPERTIES
    LimitResumeCarriesRow
CHECK_DEADLOCK FALSE

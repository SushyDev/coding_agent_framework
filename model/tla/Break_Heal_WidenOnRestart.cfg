\* A restart reads the list from the config: a remedy dropped after a failed verify is back.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "WidenOnRestart"
INVARIANTS
    NarrowsAlone
CHECK_DEADLOCK FALSE

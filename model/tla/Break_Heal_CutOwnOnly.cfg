\* A restart settles only the healer's own cut claims: a person's "act" claimed, then cut by
\* the healer's restart, is never settled.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer", "person"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "CutOwnOnly"
PROPERTIES
    ClaimsEnd
CHECK_DEADLOCK FALSE

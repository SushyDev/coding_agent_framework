\* A request asked again after a restart is refused before its lease is looked up: refused while it holds a lease.
SPECIFICATION Spec
CONSTANTS
    Shape = "Safety"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "RefuseBeforeLookup"
INVARIANTS
    RefusedIsNotFailed
CHECK_DEADLOCK FALSE

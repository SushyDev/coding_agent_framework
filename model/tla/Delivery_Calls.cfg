\* A run_delegate call, in a prompt's turn, on a row to an interactive session: a client that
\* may give up first, a crash and a restart. Every property.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 1
    Awaited = {1}
    ClientLeaves = TRUE
    SelfTurns = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 0
    Long = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
    AnswerComes
CHECK_DEADLOCK FALSE

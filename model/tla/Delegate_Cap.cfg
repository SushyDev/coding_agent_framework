\* The cap: a client that never gives up before the call's deadline, and a parent that never
\* stops. Two restarts, one kill. No report is lost, with no exception.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 2
    MaxKills = 1
    MaxParentStops = 0
    Awaited = {d1}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    ReportAnswersTheBrief
PROPERTIES
    ReportArrivesUnderCap
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

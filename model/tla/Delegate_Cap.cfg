\* The cap: a client that never gives up before the call's deadline, and a parent that never
\* stops. Two restarts. No report is lost, with no exception.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 2
    MaxKills = 2
    MaxParentStops = 0
    Awaited = {d1}
    ClientLeaves = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    AnsweredNotSent
    AnsweredWasWritten
    TwiceOnlyIfUnsure
PROPERTIES
    AnsweredStays
    ReportArrivesUnderCap
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

\* No cap: both symptoms of the kind are acted on in one bound.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "NoCap"
INVARIANTS
    CapToPrompt
CHECK_DEADLOCK FALSE

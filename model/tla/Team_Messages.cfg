\* The design: two agents, two messages, a restart; an agent of another project calls.
SPECIFICATION Spec
CONSTANTS
    Agents = {p, d1}
    Parent = p
    Foreign = {x}
    Services = {}
    MaxMsgs = 2
    MaxFaults = 0
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    NoSelfFix
    ParentNeverStopped
    SameProjectOnly
    OneOwner
PROPERTIES
    MessageDelivered
    ClaimEnds
    ServiceEndsWithOwner
CHECK_DEADLOCK FALSE

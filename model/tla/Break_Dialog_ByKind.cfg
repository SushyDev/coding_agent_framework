\* Answers kept by kind (F-203): the second menu of one start opens no prompt, so its row on
\* a dialog the pane shows has none waiting.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenMenus
    MaxRestarts = 0
    Ends = FALSE
    Auto = {"trust"}
    Break = "ByKind"
INVARIANTS
    KeptAcrossRestart
CHECK_DEADLOCK FALSE

\* The framework ends a job at its timeout over ssh; with the connection down the job runs on.
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1}
    Svcs = {}
    Paths = {f1}
    Fetched = {}
    Codes = {"1"}
    MaxDrops = 1
    MaxRestarts = 0
    MaxEdits = 0
    MaxLost = 0
    MaxSvcRestarts = 0
    Fwds = {}
    MaxFwdDrops = 0
    MaxFwdFails = 0
    MaxTaken = 0
    Break = "TimeoutFromFramework"
PROPERTIES
    JobEndsAtTimeout
CHECK_DEADLOCK FALSE

\* The design: a message to a delegate, its reply or notice, over a fault, a restart and turns the delegate starts by itself.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 1
    MaxRestarts = 1
    SelfTurns = TRUE
    Operators = {}
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToMain
    ReplyNamesMessage
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ReplyOrNoticeComes
CHECK_DEADLOCK FALSE

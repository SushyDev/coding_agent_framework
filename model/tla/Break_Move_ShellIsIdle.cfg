\* The idle read takes the session file's `shell` for `idle`: the SIGTERM ends a background
\* command the turn left running.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 1
    MaxDelegates = 0
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 0
    Resumes = FALSE
    Limited = FALSE
    Break = "ShellIsIdle"
INVARIANTS
    NothingLost
CHECK_DEADLOCK FALSE

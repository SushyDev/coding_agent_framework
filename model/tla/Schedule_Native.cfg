\* The native wrapper: two heavy runs from two modules on one slot, each a wrapper on the
\* workstation whose own process is its lease's holder, ended at any step, one restart.
SPECIFICATION Spec
CONSTANTS
    Shape = "Native"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
    NoRunUnleased
    HostCapacity
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
    QueuedIsAnswered
    EndedIsReleased
    GoneIsReleased
CHECK_DEADLOCK FALSE

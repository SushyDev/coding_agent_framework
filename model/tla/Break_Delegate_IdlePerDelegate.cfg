\* The idle notice's key names the delegate, not its idle state: a second idle state, after a
\* kill and a resume, is never told. IdleNoticed must fail.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 0
    MaxKills = 1
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Stalls = {d1}
    MaxAgain = 1
    MaxWakes = 0
    Queued = {}
    Break = "IdlePerDelegate"
INVARIANTS
    IdleToldOnce
PROPERTIES
    IdleNoticed
CHECK_DEADLOCK FALSE

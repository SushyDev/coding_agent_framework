\* The design's safety: a write (its load, paste and Enter) across a restart, starts over stale sockets, viewer deaths.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 1
    MaxWrites = 1
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    PastesItsOwnText
    OneProcessPerSocket
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

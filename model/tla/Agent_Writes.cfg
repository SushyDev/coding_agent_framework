\* The design's safety: writes across a restart, starts over stale sockets, viewer deaths.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 1
    MaxWrites = 2
    MaxRecoveryRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

\* F-256: a prompt's notice whose prompt closed before the hand-on is written all the same: the
\* check is missing. A person who answered the prompt gets its notice as if it were still open.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    Notices = {1}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    MaxRestarts = 0
    MaxEnds = 0
    MaxPrompts = 1
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {}
    Break = "ClosedTyped"
INVARIANTS
    ClosedNotHandedOn
CHECK_DEADLOCK FALSE

\* By hand: the design's events and dialogs at larger bounds, every invariant and both liveness
\* properties. No tool calls: their holds are apart from the dialogs', and Intake_Tools checks them.
SPECIFICATION Spec
CONSTANTS
    Events = {e1}
    MaxPosts = 2
    MaxDialogs = 3
    MaxCalls = 0
    MaxWaiters = 0
    MaxTexts = 0
    MaxStops = 0
    MaxToolCalls = 0
    MaxPauses = 0
    Cap = 1
    MaxRestarts = 2
    Break = "none"
INVARIANTS
    TypeOK
    AckedIsStored
    StoredOnce
    SentAtMostOnce
    OnlyNamedDialog
    AnsweredWasHeard
    NeverTyped
PROPERTIES
    RequestsEnd
    HoldSettles
CHECK_DEADLOCK FALSE

\* By hand: two messages and their delivery over a restart, every invariant and every liveness property.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q, e1}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 2
    MaxFaults = 0
    MaxRestarts = 1
    SelfTurns = FALSE
    Operators = {}
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
CHECK_DEADLOCK FALSE

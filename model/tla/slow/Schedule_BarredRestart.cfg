\* By hand: Schedule_Barred with one restart, so a caller that goes while the queue is lost
\* asks no more and is still answered or gone (F-276). 47 s at load 23 on 12 cores.
SPECIFICATION Spec
CONSTANTS
    Shape = "Barred"
    QueueBound = 2
    MaxWait = 2
    MaxCrashes = 1
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
    NoGrantToGone
    KeepsPlace
    QueuedIsAnswered
    EndedIsReleased
CHECK_DEADLOCK FALSE

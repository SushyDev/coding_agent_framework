\* By hand: the design's safety at F-1's bounds for writes (three starts, two writes).
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 3
    MaxServerDeaths = 1
    MaxViewerDeaths = 1
    MaxWrites = 2
    MaxRecoveryRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

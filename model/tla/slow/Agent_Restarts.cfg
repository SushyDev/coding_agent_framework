\* By hand: the design over two server restarts, every invariant and both liveness properties.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 3
    MaxServerDeaths = 2
    MaxViewerDeaths = 1
    MaxWrites = 2
    MaxRecoveryRestarts = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
    OneReopenPerLoss
PROPERTIES
    AgentOutlivesServer
    LostViewerReopened
    UnviewedAgentSeen
CHECK_DEADLOCK FALSE

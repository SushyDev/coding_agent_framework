\* By hand: an interactive and a headless agent on one account that can spend, two limits, a
\* person's act, a restart; every property.
SPECIFICATION Spec
CONSTANTS
    Agents = {i1, h1}
    Headless = {h1}
    Mains = {}
    Others = FALSE
    CanSpend = TRUE
    MaxLimits = 2
    Bound = 1
    AutoMax = 1
    MaxOutside = 1
    MaxRestarts = 1
    Starts = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    NeverSpends
    NoResumeOnLimited
    GoOnOnce
    MenuPressedOnce
    BoundedRetries
PROPERTIES
    NoStartOnLimited
    NoAgentLeftLimited
    RecordRead
CHECK_DEADLOCK FALSE

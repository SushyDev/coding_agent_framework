\* A start in a folder the operator's rule names (F-286), whole: the rule's press of the trust
\* dialog, the imports dialog, a restart, and an end asked while either shows. The fast check is
\* Dialog_Trusted.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 1
    Ends = TRUE
    Trusted = TRUE
    Auto = {}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart NoTurnAfterEnd
PROPERTIES
    DialogShown GoesOn RulePasses EndEnds
CHECK_DEADLOCK FALSE

\* A new account's start: the trust dialog, then two menus no rule names, one after the other.
\* The app's callback answers the trust dialog; each menu is its own read, asked of a person,
\* across one restart, of Sessions or of the agent's own process.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenMenus
    MaxRestarts = 1
    Auto = {"trust"}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart
PROPERTIES
    DialogShown GoesOn
CHECK_DEADLOCK FALSE

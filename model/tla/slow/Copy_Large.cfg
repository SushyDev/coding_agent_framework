\* By hand: a job with a fetch and a service with a restart on one copy, a drop, a restart and a lost wrapper; every property.
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1}
    Svcs = {s1}
    Paths = {f1}
    Fetched = {f1}
    Codes = {"1"}
    MaxDrops = 1
    MaxRestarts = 1
    MaxEdits = 0
    MaxLost = 1
    MaxSvcRestarts = 1
    Fwds = {}
    MaxFwdDrops = 0
    MaxFwdFails = 0
    MaxTaken = 0
    Break = "none"
INVARIANTS
    TypeOK
    StartsOnSyncedCopy
    OneSyncWrites
    NoUntrackedProcess
    AnswerIsReal
    FetchOnlyNamed
    FetchOnlyAfterEnd
    NoEditLost
    JobGoneAtEnd
    OneProcess
    EndedIsEnded
PROPERTIES
    RunAnswered
    JobEndsAtTimeout
    JobSettles
    ServiceEndsWithOwner
CHECK_DEADLOCK FALSE

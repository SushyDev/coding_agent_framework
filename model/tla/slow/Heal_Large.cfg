\* By hand: the design with a third state per symptom, every invariant and both liveness properties.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer", "person"}
    MaxActs = 1
    MaxState = 3
    MaxRestarts = 1
    MaxBounds = 1
    Break = "none"
INVARIANTS
    TypeOK
    OncePerState
    RecordedFirst
    UnknownNotRetried
    CapToPrompt
    NarrowsAlone
    OnlyApproved
    OnlyOnSymptom
    ActOnlyForBound
PROPERTIES
    ActedOrAsked
    ClaimsEnd
CHECK_DEADLOCK FALSE

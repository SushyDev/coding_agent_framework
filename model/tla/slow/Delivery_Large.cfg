\* By hand: an interactive session and a headless one, two senders, a call, crashes, a stop and
\* restarts; every invariant and property.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3, 4}
    Addrs = {m, d}
    Headless = {d}
    Senders = {s1, s2}
    MaxSent = 3
    Awaited = {1}
    ClientLeaves = TRUE
    SelfTurns = TRUE
    Continues = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 1
    Long = {}
    Wide = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
PROPERTIES
    SendingSettles
    Arrives
    AnswerComes
CHECK_DEADLOCK FALSE

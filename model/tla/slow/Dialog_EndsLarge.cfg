\* An end asked while the start waits on a dialog (F-231), whole: the trust dialog, then the
\* imports dialog, with a restart. The fast checks are Dialog_Ends and Dialog_EndsTerm.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustThenImports
    MaxRestarts = 1
    Ends = TRUE
    Trusted = FALSE
    Auto = {}
    Break = "none"
INVARIANTS
    TypeOK OnlyAsked OnNamed AtMostOnce OnlyRightful NotEndedOnDialog LeaseWhileLive
    KeptAcrossRestart NoTurnAfterEnd
PROPERTIES
    DialogShown GoesOn EndEnds
CHECK_DEADLOCK FALSE

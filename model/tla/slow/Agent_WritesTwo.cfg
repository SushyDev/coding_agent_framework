\* The design's safety with two writes, each a load, a paste and an Enter, across a restart and a viewer's death.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 2
    MaxServerDeaths = 1
    MaxViewerDeaths = 1
    MaxWrites = 2
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    PastesItsOwnText
    OneProcessPerSocket
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

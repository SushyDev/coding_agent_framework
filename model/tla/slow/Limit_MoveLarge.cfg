\* Slow: an interactive delegate and a main session on one account, one limit, a
\* person's act, a restart. The delegate moves on its own once; the main only by an answer.
SPECIFICATION Spec
CONSTANTS
    Agents = {d1, m1}
    Headless = {}
    Mains = {m1}
    Others = TRUE
    CanSpend = FALSE
    MaxLimits = 1
    Bound = 1
    AutoMax = 1
    MaxOutside = 1
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    NeverSpends
    NoResumeOnLimited
    GoOnOnce
    MenuPressedOnce
    BoundedRetries
    NeverMovesMain
    MoveOnce
PROPERTIES
    NoStartOnLimited
    NoAgentLeftLimited
    RecordRead
CHECK_DEADLOCK FALSE

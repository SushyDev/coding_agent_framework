\* By hand: the design's safety over two server restarts, with every invariant and one write.
\* One write reaches every wrong delivery two would: a write changes only what no other step
\* reads. slow/Agent_WritesLarge checks two writes over one restart.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 3
    MaxServerDeaths = 2
    MaxViewerDeaths = 1
    MaxWrites = 1
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "none"
INVARIANTS
    TypeOK
    WriteReachesItsSession
    OldPaneIdNeverReachesAnother
    OneProcessPerSocket
    OneReopenPerLoss
    NoActOnOneWrongReading
PROPERTIES
    AgentOutlivesServer
CHECK_DEADLOCK FALSE

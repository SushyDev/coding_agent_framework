\* By hand: the design's liveness over two server restarts, with two agents and three starts.
\* No writes: they change nothing the properties read. slow/Agent_RestartsWrites checks them.
SPECIFICATION Spec
CONSTANTS
    Agents = {a1, a2}
    MaxStarts = 3
    MaxServerDeaths = 2
    MaxViewerDeaths = 1
    MaxWrites = 0
    MaxRecoveryRestarts = 0
    MaxLateViewers = 0
    Break = "none"
INVARIANTS
    TypeOK
    OneProcessPerSocket
    OneReopenPerLoss
    NoActOnOneWrongReading
PROPERTIES
    AgentOutlivesServer
    LostViewerReopened
    UnviewedAgentSeen
CHECK_DEADLOCK FALSE

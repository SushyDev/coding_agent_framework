\* The design: three Stops of one session held for the app's callback, a cap of 2, one
\* tool call between, one restart. Intake_StopPause checks the pause.
SPECIFICATION Spec
CONSTANTS
    Events = {}
    MaxPosts = 0
    MaxDialogs = 0
    MaxCalls = 0
    MaxWaiters = 0
    MaxTexts = 0
    MaxStops = 3
    MaxToolCalls = 1
    MaxPauses = 0
    Cap = 2
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    StopOneResponse
    StopLateDropped
    NeverOverridden
    CountKept
    NotWhilePaused
PROPERTIES
    StopRequestsEnd
CHECK_DEADLOCK FALSE

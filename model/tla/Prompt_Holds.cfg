\* Held prompts: a subagent's permission request, which the asker's parent may answer, and a Stop hold at Claude Code's cap; deadlines, the whole restart and the asker's own.
SPECIFICATION Spec
CONSTANTS
    Ps = {"perm", "cap"}
    HeldPs <- AloneHeld
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 9
    MaxRestarts = 1
    MaxTools = 1
    Break = "none"
INVARIANTS
    TypeOK OneAnswer OnlyRightful NotAfterDeadline DefaultOnlyDeclared KeptAcrossRestart
    NeverOverridden OneClaimPerState NoActOnCutOffClaim OneResponse LateDropped OnlyNamed
    ParentToldOnce
PROPERTIES
    PromptsEnd ParentTold HoldsEnd ClaimsEnd
CHECK_DEADLOCK FALSE

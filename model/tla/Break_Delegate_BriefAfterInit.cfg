\* A headless start waits for its init before its brief, as before F-152: the process writes its
\* init only after it read a line, and the brief goes in only once the row runs, so the start
\* never settles.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 0
    MaxKills = 0
    MaxParentStops = 0
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {}
    MaxPersonTurns = 0
    Break = "BriefAfterInit"
PROPERTIES
    CallSettles
CHECK_DEADLOCK FALSE

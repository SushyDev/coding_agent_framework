\* The resume carries no row: a message due at the resume waits for a waiter, which the resumed
\* process has none of until a person's prompt ends a turn.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 0
    MaxBg = 0
    MaxDelegates = 0
    MaxMsgs = 1
    MaxCrashes = 0
    MaxRestarts = 0
    Break = "NoResumeLaunch"
PROPERTIES
    RowsArrive
CHECK_DEADLOCK FALSE

\* Without the guard: a main absent a second time within the bound is resumed again, not asked.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Mains = {m1}
    MaxActs = 2
    MaxState = 3
    MaxRestarts = 0
    MaxBounds = 0
    MayWait = FALSE
    Messages = FALSE
    Break = "ResumeTwice"
INVARIANTS
    ResumeOncePerBound
CHECK_DEADLOCK FALSE

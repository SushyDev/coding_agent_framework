\* The design with one delegate over two restarts and two parent stops.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 2
    MaxKills = 2
    MaxParentStops = 2
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
PROPERTIES
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

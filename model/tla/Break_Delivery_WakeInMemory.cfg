\* F-240: the wake line's mark is memory. The session ignores the line, the framework restarts,
\* and the line is typed a second time for the same row.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = FALSE
    MaxRestarts = 1
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {1}
    Wide = {1}
    Launched = {}
    Break = "WakeInMemory"
INVARIANTS
    WakeOnce
CHECK_DEADLOCK FALSE

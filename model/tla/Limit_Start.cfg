\* The design: a start of new work refused at the account's limit (F-196), a headless agent
\* whose record limits it, two limits, a person's acts, a restart. Its row waits for the reset,
\* is picked again, and waits again for a newer limit.
SPECIFICATION Spec
CONSTANTS
    Agents = {h1}
    Headless = {h1}
    Mains = {}
    Others = FALSE
    CanSpend = FALSE
    MaxLimits = 2
    Bound = 1
    AutoMax = 0
    MaxOutside = 2
    MaxRestarts = 1
    Starts = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    NeverSpends
    NoResumeOnLimited
    GoOnOnce
    MenuPressedOnce
    BoundedRetries
    LimitNotReport
    StartPromptIsRow
PROPERTIES
    NoStartOnLimited
    NoAgentLeftLimited
    RecordRead
    StartWaitEnds
CHECK_DEADLOCK FALSE

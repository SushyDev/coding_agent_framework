\* The landing hold: a landing holds the lock and one of two slots, a second waits for the lock,
\* and a heavy run must leave it the other slot. No restart.
SPECIFICATION Spec
CONSTANTS
    Shape = "Hold"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 0
    Break = "none"
INVARIANTS
    TypeOK
    CapacityHolds
    NoDoubleGrant
    ReleaseOnce
    GangAtomic
    AnsweredByDeadline
    RefusedIsNotFailed
PROPERTIES
    ClassOrder
    NoStartUnderSevere
    NoStartWithoutBudget
    NoHeavyUnderHigh
CHECK_DEADLOCK FALSE

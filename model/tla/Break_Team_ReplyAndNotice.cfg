\* A notice read from the process's end, not the fold: a turn that answered and then died gets a reply and a notice.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 1
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {}
    Break = "ReplyAndNotice"
INVARIANTS
    ReplyOrNotice
CHECK_DEADLOCK FALSE

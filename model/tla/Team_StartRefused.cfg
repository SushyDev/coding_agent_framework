\* A delegate's start refused once its call reached Sessions (F-153): its row is ended by the
\* settle, so the operator may end its main session; a message to it is marked ended. One
\* project, to keep it fast: Team_MainEnds has the second main session.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}}
    Mains = {p}
    Services = {}
    MaxMsgs = 1
    MaxAsks = 0
    MaxRequests = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    StartsRefused = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    MainEndedByOperator
    MainEndedIdle
    NoDelegateWithoutParent
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
    OperatorRowsKept
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
    ReplyOrNoticeComes
    RefusedEnds
CHECK_DEADLOCK FALSE

\* Pressure that bars a request refuses it at once, so it holds no place: its requester asks
\* again later, and a freed slot goes to a later asker of its module while it waits.
SPECIFICATION Spec
CONSTANTS
    Shape = "Barred"
    QueueBound = 2
    MaxWait = 2
    MaxCrashes = 0
    Break = "BarredSkipsQueue"
PROPERTIES
    KeepsPlace
CHECK_DEADLOCK FALSE

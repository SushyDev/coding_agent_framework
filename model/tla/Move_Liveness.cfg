\* The liveness: a drained session moves, and a delegate's report in flight is delivered across
\* the move, with a person's prompt and a restart.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 1
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 0
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    NothingLost
    TranscriptKept
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    NoStartWhileDraining
    DrainedParentMoves
    RowsArrive
CHECK_DEADLOCK FALSE

\* A headless session: its brief and a message, turns it starts by itself, two ends of its process
\* (a resume, then a notice), a restart, and the answers. Every invariant.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2, 3, 4, 5}
    Addrs = {d}
    Headless = {d}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = TRUE
    Continues = FALSE
    MaxRestarts = 1
    MaxEnds = 2
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {}
    Break = "none"
INVARIANTS
    TypeOK
    AtMostOnce
    OnlyIntoEndedTurn
    NotCutByStop
    OnlyToItsProcess
    InOrder
    DeliveredWasTaken
    EndedNotDelivered
    ReplyOnce
    ReplyOrNotice
    ReplyNamesItsRow
    AnswersTheBrief
CHECK_DEADLOCK FALSE

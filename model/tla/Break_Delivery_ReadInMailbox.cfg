\* ReadInMailbox (F-289): the settle's read is a step of Mailbox, as before F-289, so a call
\* made while a row is read waits through the read, which may take longer than any bound.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1, s2}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = FALSE
    MaxRestarts = 1
    MaxEnds = 1
    MaxPrompts = 1
    MaxStops = 1
    Long = {2}
    Wide = {}
    Launched = {}
    Break = "ReadInMailbox"
INVARIANTS
    CallInBound
CHECK_DEADLOCK FALSE

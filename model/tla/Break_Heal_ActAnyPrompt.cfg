\* "act" offered on a prompt asked off the list: a person acts on a kind only the operator may widen.
SPECIFICATION Spec
CONSTANTS
    Symptoms = {s1, s2}
    Kinds = {k1}
    Kind <- OneKind
    Approved = {k1}
    Actors = {"healer", "person"}
    MaxActs = 1
    MaxState = 2
    MaxRestarts = 1
    MaxBounds = 1
    Break = "ActAnyPrompt"
INVARIANTS
    ActOnlyForBound
CHECK_DEADLOCK FALSE

\* The design: two projects, a message along any edge, a restart, and its delivery.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q, e1}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxFaults = 0
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainNeverFixed
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
CHECK_DEADLOCK FALSE

\* The design: two projects, a message along any edge, a restart, and its delivery.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 1
    MaxAsks = 0
    MaxFaults = 0
    MaxRestarts = 1
    SelfTurns = FALSE
    Operators = {}
    StopsUnknown = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
    ReplyOrNoticeComes
CHECK_DEADLOCK FALSE

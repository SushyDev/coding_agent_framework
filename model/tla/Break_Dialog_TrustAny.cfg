\* The rule presses the trust dialog of a folder it does not name: TLC must find a press no
\* one asked for.
SPECIFICATION Spec
CONSTANTS
    Dialogs <- TrustOnly
    MaxRestarts = 0
    Ends = FALSE
    Trusted = FALSE
    Auto = {}
    Break = "TrustAny"
INVARIANTS
    OnlyAsked
CHECK_DEADLOCK FALSE

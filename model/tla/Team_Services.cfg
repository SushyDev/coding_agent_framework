SPECIFICATION Spec
CONSTANTS
    Agents = {p, d1}
    Parent = p
    Foreign = {x}
    Services = {s1}
    MaxMsgs = 0
    MaxFaults = 1
    MaxRestarts = 1
    Break = "none"
INVARIANTS

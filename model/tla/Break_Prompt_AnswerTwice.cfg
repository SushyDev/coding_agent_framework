\* An answer does not check its prompt is still open: a limit answered once is answered again, and its move applied twice.
SPECIFICATION Spec
CONSTANTS
    Ps = {"limit", "restarts"}
    HeldPs = {}
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {"limit"}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 1
    MaxRestarts = 2
    MaxTools = 0
    Break = "AnswerTwice"
INVARIANTS
    OneAnswer
CHECK_DEADLOCK FALSE

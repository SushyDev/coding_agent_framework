\* An answer does not check its prompt is still open: a permission prompt that expired is answered.
SPECIFICATION Spec
CONSTANTS
    Ps = {"perm", "cap"}
    HeldPs <- AloneHeld
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 9
    MaxRestarts = 1
    MaxTools = 1
    Break = "LateAnswer"
INVARIANTS
    NotAfterDeadline
CHECK_DEADLOCK FALSE

\* Break RetryBlocked (F-270): an interrupt of a main session that did not end the turn keeps its state, so the stuck session's retry is refused as claimed until it moves by itself. TLC must find InterruptRetryOpen violated.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p}}
    Mains = {p}
    Services = {}
    MaxMsgs = 0
    MaxAsks = 0
    MaxRequests = 0
    MaxFaults = 2
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    StartsRefused = FALSE
    Forcing = FALSE
    Break = "RetryBlocked"
INVARIANTS
    InterruptRetryOpen
CHECK_DEADLOCK FALSE

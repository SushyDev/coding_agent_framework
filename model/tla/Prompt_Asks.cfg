\* An ask, its owner Mailbox (F-172): a person answers it or withdraws it, the two racing to one settle; the whole restart and the asker's own.
SPECIFICATION Spec
CONSTANTS
    Ps = {"ask"}
    HeldPs <- AloneHeld
    Agents <- TreeAgents
    Parent <- TreeParent
    Persons = {"person"}
    ParentKinds = {"permission", "plan", "elicitation"}
    AppKinds = {"limit"}
    DefaultKinds = {"limit"}
    ExpireKinds = {"permission", "stop_cap"}
    Cap = 2
    Budget = 1
    MaxRestarts = 2
    MaxTools = 0
    Break = "none"
INVARIANTS
    TypeOK OneAnswer AnsweredOnce OnlyRightful NotAfterDeadline DefaultOnlyDeclared
    KeptAcrossRestart OneClaimPerState NoActOnCutOffClaim ParentToldOnce
PROPERTIES
    PromptsEnd ParentTold ClaimsEnd
CHECK_DEADLOCK FALSE

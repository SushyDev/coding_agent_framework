\* A start whose caller lost the mark's answer (its call's timeout, while Mailbox was busy) makes
\* no start and tells Mailbox nothing, as before F-284: the row stays in the mark's memory, which
\* no evidence settles, so it stays sending for good and SendingSettles fails.
SPECIFICATION Spec
CONSTANTS
    Ids = {1}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 1
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = FALSE
    MaxRestarts = 0
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {}
    Wide = {}
    Launched = {m}
    Break = "LostMark"
PROPERTIES
    SendingSettles
CHECK_DEADLOCK FALSE

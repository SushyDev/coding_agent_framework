\* An interactive delegate: its brief and its word to go on carried by the start, a person's
\* turn after the brief's, one kill, a restart and a parent stop. Every invariant and liveness
\* property.
SPECIFICATION Spec
CONSTANTS
    Delegates = {d1}
    Cap = 1
    MaxRestarts = 1
    MaxKills = 1
    MaxParentStops = 1
    Awaited = {}
    ClientLeaves = FALSE
    Interactive = {d1}
    MaxPersonTurns = 1
    Stalls = {}
    MaxAgain = 0
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    DeliveredWasTaken
    EndsAfterDelivery
    ReportKept
    ResumedAtMostOnce
    SecondKillNotRetried
    CapHeld
    RefusedHoldsNothing
    OneMessagePerProcess
    ReportAnswersTheBrief
PROPERTIES
    ReportArrives
    DeliveredDelegateEnds
    CallSettles
CHECK_DEADLOCK FALSE

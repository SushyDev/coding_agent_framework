\* A start that waited at a limit goes at its reset on the pick it was refused by, so a newer
\* limit read meanwhile does not hold it: it starts on a limited account.
SPECIFICATION Spec
CONSTANTS
    Agents = {h1}
    Headless = {h1}
    Mains = {}
    Others = FALSE
    CanSpend = FALSE
    MaxLimits = 2
    Bound = 1
    AutoMax = 0
    MaxOutside = 1
    MaxRestarts = 0
    Starts = TRUE
    Break = "NoRepick"
PROPERTIES
    NoStartOnLimited
CHECK_DEADLOCK FALSE

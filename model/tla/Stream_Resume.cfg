\* The design: two messages and a request, an exit and a resume, no restart (F-51, new-1).
SPECIFICATION Spec
CONSTANTS
    MaxMsgs = 2
    MaxReqs = 1
    MaxRestarts = 0
    MaxResumes = 1
    Break = "none"
INVARIANTS
    TypeOK
    NoDoubleRead
    NoSkippedEvent
    NoPartialRead
    NeverMalformed
    WrittenOnce
    TakenOnce
    IntoEndedTurn
    OneWaiting
    DeliveredWasTaken
    UndeliveredWasNotTaken
    OnlyNamedRequest
    AnswerOnce
    AnsweredWasTaken
    EndNeverCuts
    EndAfterReport
PROPERTIES
    ReplayedOrFound
    ResentOrGone
    IdleReturns
    AnswerSettles
CHECK_DEADLOCK FALSE

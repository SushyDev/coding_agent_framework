\* A grant counts only the leases this run monitors: after a restart, a second heavy run takes the slot a live one holds.
SPECIFICATION Spec
CONSTANTS
    Shape = "Safety"
    QueueBound = 1
    MaxWait = 2
    MaxCrashes = 1
    Break = "CountInMemory"
INVARIANTS
    CapacityHolds
CHECK_DEADLOCK FALSE

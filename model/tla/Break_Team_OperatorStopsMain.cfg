\* The operator stops an idle main session, which then ends.
SPECIFICATION Spec
CONSTANTS
    Projects = {{p}, {q}}
    Mains = {p, q}
    Services = {}
    MaxMsgs = 0
    MaxAsks = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}

\* The design, with another account: a start of new work at the account's limit (F-196), a
\* headless delegate, one limit, a person's act, a restart. Another account with room takes the
\* start; none, the row waits for the reset.
SPECIFICATION Spec
CONSTANTS
    Agents = {h1}
    Headless = {h1}
    Mains = {}
    Others = TRUE
    CanSpend = FALSE
    MaxLimits = 1
    Bound = 1
    AutoMax = 0
    MaxOutside = 1
    MaxRestarts = 1
    Starts = TRUE
    Break = "none"
INVARIANTS
    TypeOK
    NeverSpends
    NoResumeOnLimited
    GoOnOnce
    MenuPressedOnce
    BoundedRetries
    LimitNotReport
    NeverMovesMain
    MoveOnce
    StartPromptIsRow
PROPERTIES
    NoStartOnLimited
    NoAgentLeftLimited
    RecordRead
    StartWaitEnds
CHECK_DEADLOCK FALSE

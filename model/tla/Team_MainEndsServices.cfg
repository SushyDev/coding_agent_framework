    Projects = {{p, d1}, {q}}
    Mains = {p, q}
    Services = {s1}
    MaxMsgs = 0
    MaxAsks = 0
    MaxFaults = 0
    MaxRestarts = 0
    SelfTurns = FALSE
    Operators = {o}
    StopsUnknown = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    AlongEdges
    EndedNotDelivered
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    OnlyParentFixes
    NoSelfFix
    MainFixedByOperatorOnly
    MainEndedByOperator
    MainEndedIdle
    NoDelegateWithoutParent
    OneOwner
    ServiceFixedByOwnerOrParent
    HandedAlongEdge
    ReplyOnce
    ReplyOrNotice
    ReplyToSender
    ReplyNamesMessage
    OperatorRowsKept
PROPERTIES
    MessageDelivered
    EndedMarked
    ClaimEnds
    ServiceEndsWithOwner
    ReplyOrNoticeComes
CHECK_DEADLOCK FALSE

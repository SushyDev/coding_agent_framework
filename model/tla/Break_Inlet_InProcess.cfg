\* The Inlet runs a call in its own process: a call queued behind a long one is answered only after its deadline.
SPECIFICATION Spec
CONSTANTS
    Callers = {"long", "short"}
    Bound <- LongShort
    Timeout <- Tight
    MaxTime = 10
    Break = "InProcess"
INVARIANTS
    AnsweredByDeadline
CHECK_DEADLOCK FALSE

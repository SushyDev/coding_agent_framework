\* The design: a delegate's report in flight across the move, a person's prompt, a crash of the
\* old process, a restart. Every invariant and the drain's action property.
SPECIFICATION Spec
CONSTANTS
    Accounts = {a1, a2}
    Home = a1
    Main = m
    Senders = {q}
    MaxPrompts = 1
    MaxBg = 1
    MaxDelegates = 1
    MaxMsgs = 0
    MaxCrashes = 1
    MaxRestarts = 1
    Resumes = FALSE
    Break = "none"
INVARIANTS
    TypeOK
    OneAccountAtATime
    NothingLost
    LateEndNeverEndsMoved
    OnceAcrossMove
    NotCutByEnd
    OnlyToItsProcess
    OnlyIntoEndedTurn
    DeliveredIsKept
PROPERTIES
    TranscriptKept
    NoStartWhileDraining
CHECK_DEADLOCK FALSE

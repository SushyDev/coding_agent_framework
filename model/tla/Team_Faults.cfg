\* The design, safety only: two agents, two messages, a fault and a restart.
SPECIFICATION Spec
CONSTANTS
    Agents = {p, d1}
    Parent = p
    Foreign = {x}
    Services = {}
    MaxMsgs = 2
    MaxFaults = 1
    MaxRestarts = 1
    Break = "none"
INVARIANTS
    TypeOK
    DeliveredAtMostOnce
    OnlyIntoEndedTurn
    InOrder
    OneClaimPerState
    OneFixPerState
    FixOnClaimedState
    NoSelfFix
    ParentNeverStopped
    SameProjectOnly
    OneOwner
CHECK_DEADLOCK FALSE

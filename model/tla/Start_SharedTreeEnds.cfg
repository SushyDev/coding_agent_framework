\* Start_SharedTree's states, and the rest of its temporal properties: a stopping row whose
\* process is gone settles, and an orphan or a late stop ends.
SPECIFICATION Spec
CONSTANTS
    S = {s1, s2}
    NPids = 2
    MaxStarts = 1
    MaxRestarts = 1
    MaxForeign = 0
    Worktrees = TRUE
    Shared = TRUE
    Before = {"none", "tree"}
    MaxOutside = 1
    MaxHardKills = 0
    MaxClears = 0
    SplitEnds = FALSE
    Break = "none"
PROPERTIES
    StoppingSettles
    OrphanEnds
    LateStopEnds
CHECK_DEADLOCK FALSE

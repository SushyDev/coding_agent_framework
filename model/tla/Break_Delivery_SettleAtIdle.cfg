\* F-277: a typed row's line delivers it only while its turn reads ended, as the code did before.
\* The app answers the waiter at each turn's end and the turn goes on, so no settle reads an ended
\* turn: row 1 stays sending for good, and row 2 behind it never goes.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 2}
    Addrs = {m}
    Headless = {}
    Senders = {s1}
    MaxSent = 2
    Awaited = {}
    ClientLeaves = FALSE
    SelfTurns = FALSE
    Continues = TRUE
    MaxRestarts = 0
    MaxEnds = 0
    MaxPrompts = 0
    MaxStops = 0
    Long = {1}
    Wide = {}
    Launched = {}
    Break = "SettleAtIdle"
PROPERTIES
    SendingSettles
CHECK_DEADLOCK FALSE
